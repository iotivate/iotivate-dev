services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iotivate
      POSTGRES_PASSWORD: iotivate_dev
      POSTGRES_DB: iotivate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://iotivate:iotivate_dev@db:5432/iotivate
      SECRET_KEY: docker-dev-secret-change-in-prod
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
